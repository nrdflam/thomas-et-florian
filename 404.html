<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0000EE">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Page introuvable · Thomas &amp; Florian</title>
<style>
/* Page d'erreur autonome : chemins absolus (/…), car elle peut être servie à n'importe quelle profondeur d'URL. */
:root{--desk:#ECEDF3;--ink:#0B1446;--blue:#0000EE;--mute:#70758F}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--desk);color:var(--ink)}
body{display:grid;place-items:center;padding:16px;font:15px/1.6 "Courier Prime","Courier New",Courier,monospace;text-align:center}
::selection{background:var(--blue);color:#fff}
pre{color:var(--blue);font:inherit;font-size:clamp(9px,2.4vw,14px);line-height:1.1;margin-bottom:2em}
p{max-width:34ch;margin:0 auto 1.6em}
.fn{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--mute);margin-bottom:2.4em}
a{color:var(--blue);font-weight:700;text-decoration:none}
a:hover,a:focus-visible{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="fn">PAGE_INTROUVABLE.txt</div>
  <pre aria-hidden="true">
 _  _    ___   _  _
| || |  / _ \ | || |
| || |_| | | || || |_
|__   _| |_| ||__   _|
   |_|  \___/    |_|</pre>
  <p>Cette page n’existe pas, ou plus. Comme certaines de nos idées.</p>
  <a href="/">← Retour à l’accueil</a>
</main>
</body>
</html>
