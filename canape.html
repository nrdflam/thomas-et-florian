<style>
:root{
  --desk:#ECEDF3; --ink:#0B1446; --blue:#0000EE; --nuit:#010824; --accent:#3D3DFF;
  --bg:var(--desk); --fg:var(--blue); --hd:var(--blue);
  --ui:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
html[data-pal="nuit"]{--bg:var(--nuit); --fg:var(--accent); --hd:#fff}
html[data-pal="bleu"]{--bg:var(--blue); --fg:#fff; --hd:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--hd);overflow:hidden}
body{font-family:var(--ui);font-size:12px;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
#ascii{position:fixed;inset:0;width:100%;height:100%;display:block}

/* barre du haut, comme les pages projet */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 16px 10px;font-size:11px;letter-spacing:.02em;background:var(--bg)}
html.embed .top{display:none}
.top .back{justify-self:start;text-decoration:none;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.top .back:hover{text-decoration:underline;text-underline-offset:3px}
.top .file{display:flex;align-items:center;gap:10px;min-width:0}
.top .ico{flex:none;width:14px;height:16px}
.top .fn{white-space:pre;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:500}

/* dev control, en bas à gauche */
.dev{position:fixed;left:12px;bottom:12px;z-index:50;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.dev > button{font:inherit;color:#fff;background:var(--nuit);border:1px solid rgba(255,255,255,.25);padding:7px 10px;cursor:pointer}
.dev .pan{margin-bottom:8px;background:var(--nuit);border:1px solid rgba(255,255,255,.25);padding:12px;display:grid;gap:12px;width:260px;max-height:calc(100vh - 80px);overflow:auto}
.dev .pan[hidden]{display:none}
.dev .lb{opacity:.55;margin-bottom:6px;display:flex;justify-content:space-between}
.dev .seg{display:flex;gap:4px;flex-wrap:wrap}
.dev .seg button{font:inherit;color:#fff;background:none;border:1px solid rgba(255,255,255,.3);padding:5px 7px;cursor:pointer}
.dev .seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.dev input[type=range]{width:100%;accent-color:#3D3DFF}
</style>
</head>

const hash = (i, j, s) => { let h = (i * 374761393 + j * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };

// image source en niveaux de gris, échantillonnée sur la grille de caractères
const img = new Image(); img.src = IMG;
const off = document.createElement("canvas"), octx = off.getContext("2d", {willReadFrequently:true});

function layout(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  cw = +dev.cell; ch = Math.round(cw * 1.7);
  const y0 = top.offsetHeight;
  cols = Math.ceil(W / cw); rows = Math.ceil((H - y0) / ch);
  // l'image entière tient dans l'écran (contain) ; le reste prend la valeur du fond
  off.width = cols; off.height = rows;
  octx.fillStyle = "#fff"; octx.fillRect(0, 0, cols, rows);
  const ia = img.width / img.height, ga = (cols * cw) / (rows * ch);
  let dw, dh; if (ga > ia){ dh = rows; dw = rows * ch * ia / cw; } else { dw = cols; dh = cols * cw / ia / ch; }
  octx.drawImage(img, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
  const d = octx.getImageData(0, 0, cols, rows).data;
  lum = new Float32Array(cols*rows); th = new Float32Array(cols*rows); scr = new Float32Array(cols*rows);
  const lo = +dev.lo, hi = +dev.hi;
  for (let i = 0; i < cols*rows; i++){
    const v = d[i*4];
    lum[i] = Math.min(1, Math.max(0, (v - lo) / (hi - lo)));     // 0 = noir, 1 = blanc
    const x = i % cols, y = (i / cols) | 0;
    th[i] = Math.min(.999, Math.hypot(x/cols - .5, y/rows - .5) / .71 * .7 + hash(x, y, 9) * .3);
  }
  ctx.font = `500 ${(ch*.78).toFixed(1)}px "Martian Mono", ui-monospace, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const cs = getComputedStyle(document.documentElement);
  fg = cs.getPropertyValue("--fg").trim(); bg = cs.getPropertyValue("--bg").trim();
  draw();
}

function glyph(i, x, y){
  const set = SETS[dev.set], v = lum[i];
  if (dev.set === "nom"){                                   // le nom en boucle, la densité passe par l'opacité
    return v > .92 ? "" : set[(x + y * 3) % set.length];
  }
  if (dev.set === "binaire") return v > .9 ? "" : set[hash(x, y, 4) > .5 ? 0 : 1];
  return set[Math.min(set.length - 1, Math.floor(v * set.length))];
}

const G = "/\\|_-+=*:.#";
function draw(){
  const y0 = top.offsetHeight;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = fg;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    const i = y*cols + x, px = x*cw + cw/2, py = y0 + y*ch + ch/2;
    if (rev < th[i]){                                       // pas encore révélé : bruit ASCII léger
      const front = rev > 0 && th[i] - rev < .05;
      ctx.globalAlpha = front ? 1 : .22;
      ctx.fillText(front ? "#" : G[Math.floor(hash(x, y, 12) * G.length)], px, py);
      continue;
    }
    let c = glyph(i, x, y);
    if (scr[i] > .02){ c = G[Math.floor(Math.random() * G.length)]; ctx.globalAlpha = .35 + scr[i] * .65; }
    else ctx.globalAlpha = dev.set === "nom" || dev.set === "binaire" ? Math.max(.08, 1 - lum[i]) : 1;
    if (c) ctx.fillText(c, px, py);
  }
  ctx.globalAlpha = 1;
}

// reveal au chargement : la trame se dissout du centre vers les bords
function reveal(){
  if (reducedM){ rev = 1; draw(); return; }
  rev = 0; const t0 = performance.now() + 150, D = 1700;
  const step = t => { const k = Math.max(0, Math.min(1, (t - t0) / D)); rev = k*k*(3-2*k); draw(); if (k < 1) requestAnimationFrame(step); else { rev = 1.01; draw(); } };
  requestAnimationFrame(step);
}

// souris : les caractères se brouillent sur son passage, puis se recomposent
let raf = 0, last = null;
function loop(){
  let alive = false;
  for (let i = 0; i < scr.length; i++) if (scr[i] > 0){ scr[i] *= .9; if (scr[i] < .02) scr[i] = 0; else alive = true; }
  draw(); raf = alive ? requestAnimationFrame(loop) : 0;
}
addEventListener("pointermove", e => {
  if (dev.mouse !== "on" || reducedM || rev < 1 || e.pointerType !== "mouse") return;
  const y0 = top.offsetHeight, R = 3;
  const pts = last ? Math.max(1, Math.ceil(Math.hypot(e.clientX - last.x, e.clientY - last.y) / cw)) : 1;
  for (let s = 1; s <= pts; s++){
    const mx = last ? last.x + (e.clientX - last.x) * s / pts : e.clientX, my = last ? last.y + (e.clientY - last.y) * s / pts : e.clientY;
    const cx = Math.floor(mx / cw), cy = Math.floor((my - y0) / ch);
    for (let y = cy - R; y <= cy + R; y++) for (let x = cx - R; x <= cx + R; x++){
      if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
      const d = Math.hypot(x - cx, (y - cy) * ch / cw) / R; if (d > 1) continue;
      const i = y*cols + x; scr[i] = Math.max(scr[i], 1 - d);
    }
  }
  last = {x: e.clientX, y: e.clientY};
  if (!raf) raf = requestAnimationFrame(loop);
});
addEventListener("pointerleave", () => last = null);

/* dev control : réglages gardés dans le navigateur */
const pan = document.getElementById("devPan"), devBtn = document.getElementById("devBtn");
function sync(){
  document.documentElement.dataset.pal = dev.pal;
  pan.querySelectorAll(".seg[data-k]").forEach(sg => sg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", dev[sg.dataset.k] === b.dataset.v)));
  pan.querySelectorAll("[data-r]").forEach(r => { r.value = dev[r.dataset.r]; pan.querySelector(`[data-o="${r.dataset.r}"]`).textContent = dev[r.dataset.r]; });
}
devBtn.addEventListener("click", () => { pan.hidden = !pan.hidden; devBtn.setAttribute("aria-expanded", !pan.hidden); });
pan.querySelectorAll(".seg[data-k]").forEach(sg => sg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  dev[sg.dataset.k] = b.dataset.v; save(); sync(); layout();
}));
pan.querySelectorAll("[data-r]").forEach(r => r.addEventListener("input", () => { dev[r.dataset.r] = +r.value; save(); sync(); layout(); }));
document.getElementById("devPlay").addEventListener("click", reveal);
addEventListener("message", e => { if (e.data === "replay") reveal(); });

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
sync();
img.decode().then(() => { layout(); reveal(); });
document.fonts.ready.then(() => { if (img.complete) layout(); });
})();
</script>
</body>
</html>
