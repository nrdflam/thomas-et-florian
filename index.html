<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Thomas & Florian, duo créatif : projets, awards, et un script de 30 secondes.">
<title>Thomas & Florian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<style>
/* Layout : une page Google Doc à 100 % (816 px, marges de 2,54 cm), sous une fine règle pleine largeur
   collée en haut avec le nom du fichier. Le script se tape tout seul, la page est coupée net par le bloc bleu.
   Typo : Courier Prime pour le script (la police du scénario), une mono techno pour l'interface et la marque. */
:root{
  --desk:#ECEDF3;      /* bureau, gris teinté bleu */
  --paper:#FFFFFF;
  --ink:#0B1446;        /* bleu nuit, texte courant */       /* bleu nuit du site actuel */
  --blue:#0000EE;      /* le bleu lien par défaut, assumé */
  --mute:#70758F;
  --rule:#C9CCDA;
  --tick:#9DA1B8;
  --script:"Courier Prime", "Courier New", Courier, monospace;
  --ui:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;  /* à remplacer par t26-carbon */
  --size:15px;
  --proj-bg:#0000EE;   /* fond galerie (bleu) ; awards en nuit */
  --proj-fg:#FFFFFF;
  --aw-bg:#010824;
  --aw-fg:#FFFFFF;
  --aw-accent:#3D3DFF; /* bleu électrique éclairci pour rester lisible sur le nuit */
  --pad:76px;          /* marges resserrées pour tenir plus de répliques sur une ligne */
  color-scheme:light;
}
@media (max-width:640px){:root{--pad:22px;--size:13.5px}}
*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--ink)}
body{font-family:var(--ui);font-size:12px;margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
::selection{background:var(--blue);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.col{width:min(816px,calc(100% - 32px));margin-inline:auto}

/* ---------- barre du haut : nom du fichier + règle pleine largeur ---------- */
.hero{position:relative;z-index:1}
/* fond pointillé façon FigJam, dessiné en canvas sous la feuille ; autour du curseur, les points deviennent de l'ASCII */
#dots{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.after{position:relative;z-index:1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk)}
.file{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:13px 10px;padding-inline:16px;font-size:10.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.file b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.file b span{color:var(--mute);font-weight:400}
.file small{color:var(--mute);font-size:10px;white-space:nowrap}
.ruler{position:relative;height:18px;background:var(--desk);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden;user-select:none}
.ruler .text{position:absolute;top:0;bottom:0;background:var(--paper)}
.ruler .ticks{position:absolute;inset:auto 0 0 0;height:6px;
  background:
    repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 18.9px) var(--zero,0px) 100%/100% 5px no-repeat,
    repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 9.45px) var(--zero,0px) 100%/100% 3px no-repeat}
.ruler .num{position:absolute;top:3px;transform:translateX(-50%);font-size:8px;line-height:1;color:var(--mute);font-variant-numeric:tabular-nums}
.mk{position:absolute;width:9px;height:5px;background:var(--blue);transform:translateX(-50%)}
.mk.first{top:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.mk.left,.mk.right{bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%)}

/* ---------- feuille ---------- */
.wrap{position:relative;margin-top:22px}
.sheet{background:var(--paper);box-shadow:0 0 0 1px rgba(1,8,36,.05),0 1px 3px rgba(1,8,36,.07),0 18px 50px rgba(1,8,36,.06);
  padding:88px var(--pad) 110px;font-family:var(--script);font-size:var(--size);line-height:1.45}
.sheet p{margin:0;text-wrap:pretty;hyphens:none}
/* format scénario US : personnage à 2,2", dialogue à 1" de chaque côté */
.slug{font-weight:700;letter-spacing:.02em;margin-bottom:1.45em!important}
.act{margin-bottom:1.45em!important}
.act.beat{margin-top:.7em!important;margin-bottom:2.15em!important}
.who{font-weight:700;letter-spacing:.02em}
.say{margin-bottom:1.45em!important}
@media (min-width:700px){
  .who{padding-left:30%}
  .say{padding:0 7% 0 13%}
}
/* page de titre en haut, signature en bas */
.ttl{text-align:center;font-family:var(--ui);font-weight:700;font-size:clamp(15px,2vw,21px);line-height:1.2;letter-spacing:.04em;font-variation-settings:"wdth" 112.5;text-wrap:balance}
.sub{text-align:center;font-family:var(--ui);font-size:11px;letter-spacing:.2em;color:var(--blue);margin-top:.8em!important;margin-bottom:calc(var(--size) * 2.9)!important;padding-left:.2em}
.sig{margin-top:calc(var(--size) * 2.9)!important;text-align:center;font-family:var(--ui);font-weight:500;font-size:clamp(13px,1.4vw,16px);letter-spacing:.26em;color:var(--blue);padding-left:.26em}
.c{visibility:hidden}
.c.on{visibility:visible}
.sheet a{text-decoration:none;font-weight:700;color:var(--blue)}
.sheet a .c.on{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

.cur{position:absolute;left:0;top:0;width:2px;background:var(--blue);pointer-events:none;z-index:3}
.cur.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- galerie projets : bloc bleu, mise en page déstructurée ---------- */
.blue{position:relative;z-index:6;background:var(--proj-bg);color:var(--proj-fg);transition:background .3s,color .3s;padding-block:0 18vh;padding-inline:16px;overflow-x:clip}
.ghead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:16px;padding-block:20px 16px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;background:var(--proj-bg);transition:background .3s}
.ghead .num{font-variant-numeric:tabular-nums}
.gal{position:relative;max-width:1320px;margin:0 auto}
.proj{position:relative;display:block;color:inherit;text-decoration:none;margin-left:var(--l);width:min(var(--w), calc(66vh * var(--ar)));margin-top:var(--mt);will-change:transform}
.proj:first-child{margin-top:8vh}
.frame{position:relative;aspect-ratio:var(--ratio);max-width:100%}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame .ph{position:absolute;left:12px;bottom:10px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(1,8,36,.55);opacity:0;transition:opacity .25s}
.cap{position:absolute;display:flex;flex-direction:column;gap:5px;width:max-content;max-width:300px;font-size:clamp(11.5px,.45vw + 9px,14px);line-height:1.35}
.cap .fn{font-weight:500;letter-spacing:.01em;white-space:pre;min-height:1.35em}
.cap .fn .k{display:inline-block;width:.55em;height:1.05em;background:currentColor;vertical-align:-.15em;margin-left:1px;animation:blink 1.05s steps(1) infinite}
.cap .aw{list-style:none;margin:4px 0 6px;padding:0;display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:400;letter-spacing:.06em;white-space:nowrap}
.cap .aw li{opacity:0;transform:translateY(3px);transition:opacity .35s,transform .35s}
.cap .aw .ast{opacity:.6}
.proj.named .cap .aw li{opacity:.8;transform:none}
.proj.named .cap .aw li:nth-child(2){transition-delay:.12s}
.proj.named .cap .aw li:nth-child(3){transition-delay:.24s}
.cap .go{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .3s}
.proj.named .cap .go{opacity:.6}
.proj:hover .cap .go,.proj:focus-visible .cap .go{opacity:1}
.proj:focus-visible{outline:2px solid currentColor;outline-offset:6px}
/* positions de légende */
.cap.above-left{left:0;bottom:calc(100% + 12px)}
.cap.above-right{right:0;bottom:calc(100% + 12px);align-items:flex-end;text-align:right}
.cap.below-left{left:0;top:calc(100% + 12px)}
.cap.below-right{right:0;top:calc(100% + 12px);align-items:flex-end;text-align:right}
.cap.right-top{left:calc(100% + 22px);top:0}
.cap.right-mid{left:calc(100% + 22px);top:50%;transform:translateY(-50%)}
.cap.right-bottom{left:calc(100% + 22px);bottom:0}
.cap.left-bottom{right:calc(100% + 22px);bottom:0;align-items:flex-end;text-align:right}
@media (max-width:760px){
  .proj{margin-left:var(--lm,0%);width:min(var(--wm,88%), calc(60vh * var(--ar)));margin-top:16vh}
  .proj{margin-top:12vh}
  .cap,.cap.above-left,.cap.above-right,.cap.below-left,.cap.below-right,.cap.right-top,.cap.right-mid,.cap.right-bottom,.cap.left-bottom{position:static;transform:none;width:auto;max-width:100%;margin-top:12px;align-items:flex-start;text-align:left}
  .cap .fn{white-space:normal;word-break:break-word}
  .cap .aw{white-space:normal}
}


/* ---------- awards : sur le bleu, comme l'ancien site ; chaque ligne se tape en arrivant à l'écran ---------- */
.awards{position:relative;z-index:6;background:var(--aw-bg);color:var(--aw-fg);transition:background .3s,color .3s;padding-block:0 18vh;padding-inline:16px}
.ahead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:16px;padding-block:20px 16px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;background:var(--aw-bg);transition:background .3s}
.alist{list-style:none;margin:14vh auto 0;padding:0;width:min(100%, 80vw);display:flex;flex-direction:column;gap:20px;font-size:12px;line-height:1.5;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.alist li{display:flex;align-items:flex-end;gap:6px;min-height:1.4em}
.alist .l,.alist .r{position:relative}
.alist .l{white-space:pre-wrap;min-width:0}
.alist .r{white-space:pre;flex:none}
.alist .y,.alist .sep{color:var(--aw-accent)}
.alist .lead{flex:1 1 24px;min-width:24px;align-self:flex-end;height:1px;margin-bottom:.48em;background:repeating-linear-gradient(90deg,var(--aw-accent) 0 3px,transparent 3px 5px);clip-path:inset(0 100% 0 0)}
.alist li.multi{display:block;position:relative}
.alist li.multi .l{display:inline}
.alist li.multi .lead{display:inline-block;vertical-align:middle;margin:0 0 0 6px}
.alist li.multi .r{position:absolute;right:0;bottom:0}
.alist li.lead-on .lead{clip-path:inset(0 0 0 0);transition:clip-path .32s steps(14)}
.alist .k{position:absolute;left:calc(100% + 2px);top:.15em;width:.55em;height:1.05em;background:currentColor;animation:blink 1.05s steps(1) infinite}
@media (max-width:600px){
  .alist{width:100%;font-size:11px;gap:16px}
}

/* ---------- nous : retour au bureau pointillé ; deux lignes partent de nos têtes et se rejoignent en 2009 ---------- */
.nous{position:relative;z-index:1;padding-block:0 18vh;padding-inline:16px;color:var(--ink)}
.nhead{position:relative;z-index:3;display:flex;justify-content:space-between;gap:16px;padding-block:20px 16px;margin-inline:-16px;padding-inline:16px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);background:transparent}
.tl{position:relative;max-width:980px;margin:8vh auto 0;--pw:min(460px, 62vw)}
.photo{position:relative;width:var(--pw);margin:0 auto;aspect-ratio:1000/1132}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.who2{position:absolute;font-size:11px;letter-spacing:.06em;white-space:nowrap;transform:translateY(-50%);line-height:1.35}
.who2 b{display:block;font-weight:600;color:var(--blue);letter-spacing:.08em}
.who2 small{display:block;font-size:12px;letter-spacing:.01em;font-family:var(--script);color:var(--blue)}
/* à cheval sur le bord de la photo : moitié sur le ciel, moitié sur le bureau pointillé */
.who2.f{right:calc(100% - 14%);top:25%;text-align:right}      /* CRÉATIF #1, lunettes, à gauche */
.who2.t{left:calc(100% - 9%);top:37%}                          /* CRÉATIF #2, moustache, à droite */
.svgtl{position:absolute;left:0;top:0;width:100%;overflow:visible;pointer-events:none}
.svgtl path{fill:none;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:3 3}
.ents{position:relative;list-style:none;margin:0;padding:6vh 0 0}
.ent{position:relative;margin-bottom:clamp(44px,7vh,80px);--x:50%}
.ent .nd{position:absolute;left:var(--x);top:.15em;transform:translateX(-50%);font-size:13px;line-height:1;color:var(--blue);background:var(--desk);padding:2px 1px;z-index:1}
.ent .tx{width:min(320px, 100%);position:relative;background:rgba(236,237,243,.5);box-shadow:0 0 0 6px rgba(236,237,243,.5)}
.ent.R .tx{margin-left:calc(var(--x) + 22px)}
.ent.L .tx{margin-left:calc(var(--x) - 22px - min(320px, 100%));text-align:right}
.ent .yr{display:block;position:relative;font-size:11px;line-height:1.5;letter-spacing:.08em;text-transform:uppercase;min-height:1.5em;white-space:normal}
.ent .yr .y{color:var(--blue)}
.ent .yr .sep{color:var(--blue)}
.ent .yr .k{display:inline-block;width:.55em;height:1.05em;background:var(--blue);vertical-align:-.15em;margin-right:-.55em;animation:blink 1.05s steps(1) infinite}
.ent p{margin:.55em 0 0;font-family:var(--script);font-size:14px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .5s,transform .5s;text-wrap:pretty}
.ent.on p{opacity:1;transform:none}
.ent p a{color:var(--blue);font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-decoration:none;white-space:nowrap}
.ent p a:hover{text-decoration:underline}
.ent.now .yr{color:var(--blue)}
@media (max-width:760px){
  .tl{--pw:min(100%, 420px)}
  .who2.f{right:auto;left:3%;text-align:left;top:12%}
  .who2.t{left:auto;right:3%;text-align:right;top:20%}
  .ent{--x:12px!important}
  .ent .tx,.ent.L .tx{margin-left:34px;text-align:left;width:auto}
}

/* ---------- footer ---------- */
.foot{position:relative;z-index:6;background:var(--blue);color:#fff;min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:14vh;padding-inline:16px;text-align:center}
.foot h2{margin:0;font-weight:700;font-size:clamp(18px,2.4vw,30px);letter-spacing:.06em;font-variation-settings:"wdth" 112.5;text-wrap:balance}
.foot a{color:#fff;text-decoration:none;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.7);padding:12px 20px;transition:background .2s,color .2s}
.foot a:hover,.foot a:focus-visible{background:#fff;color:var(--blue)}

.after{padding-block:40px 120px;padding-inline:16px;font-size:10.5px;color:var(--mute);line-height:1.9}
.after p{margin:0}


@media (prefers-reduced-motion:reduce){.c{visibility:visible}}
/* dev control */
.dev{position:fixed;left:12px;bottom:12px;z-index:50;font-family:var(--ui, "Martian Mono", monospace);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.dev > button{font:inherit;color:#fff;background:#010824;border:1px solid rgba(255,255,255,.25);padding:7px 10px;cursor:pointer}
.dev .pan{margin-bottom:8px;background:#010824;border:1px solid rgba(255,255,255,.25);padding:12px;display:grid;gap:12px;width:250px}
.dev .pan[hidden]{display:none}
.dev .lb{opacity:.55;margin-bottom:6px;display:flex;justify-content:space-between}
.dev .seg{display:flex;gap:4px;flex-wrap:wrap}
.dev .seg button{font:inherit;color:#fff;background:none;border:1px solid rgba(255,255,255,.3);padding:5px 7px;cursor:pointer}
.dev .seg button[aria-pressed="true"]{background:#0000EE;border-color:#0000EE}
.dev input[type=range]{width:100%;accent-color:#3D3DFF}
@media (hover:none){.dev{display:none}}
</style>
</head>
<body>


<canvas id="dots" aria-hidden="true"></canvas>
<div class="dev" id="dev">
  <div class="pan" id="devPan" hidden>
    <div><div class="lb">Canapé ASCII</div><div class="seg" data-k="ascii"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div><div class="lb">Rayon <span data-o="rad"></span></div><input type="range" data-r="rad" min="30" max="200" step="5"></div>
    <div><div class="lb">Persistance ms <span data-o="life"></span></div><input type="range" data-r="life" min="700" max="4000" step="100"></div>
  </div>
  <button type="button" id="devBtn" aria-expanded="false">DEV</button>
</div>
<section class="hero" aria-label="Script de la fausse pub Thomas &amp; Florian">
  <div class="top">
    <div class="file">
      <b>THOMAS&amp;FLORIAN_30s_DefDef_V4<span>.doc</span></b>
      <small>Modifié le <span class="today"></span></small>
    </div>
    <div class="ruler" id="ruler" aria-hidden="true">
      <div class="text" id="rtext"></div>
      <div class="ticks"></div>
      <div id="nums"></div>
      <div class="mk first" id="mk-first"></div>
      <div class="mk left" id="mk-left"></div>
      <div class="mk right" id="mk-right"></div>
    </div>
  </div>
  <div class="col wrap" id="wrap">
    <article class="sheet" id="sheet">
      <div id="script"></div>
    </article>
    <div class="cur" id="cur"></div>
  </div>
</section>

<section class="blue" id="projets" aria-label="Nos projets">
  <div class="ghead"><span>Nos projets</span><span class="num" id="gnum">01 / 08</span></div>
  <div class="gal" id="gal"></div>
</section>
<section class="awards" id="awards" aria-label="Nos awards">
  <div class="ahead"><span>Nos awards</span></div>
  <ol class="alist" id="alist"></ol>
</section>
<section class="nous" id="nous" aria-label="Nous">
  <div class="nhead"><span>Nous</span></div>
  <div class="tl" id="tl">

<script>

const SCRIPT = [

  {k:"who",  t:"CRÉATIF #1"},
  {k:"say",  t:"Notre meilleure idée, c’était encore la fausse pub."},
  {k:"who",  t:"CRÉATIF #2"},
  {k:"say",  t:"Tu vois ça comment ?"},
  {k:"who",  t:"CRÉATIF #1"},
  {k:"say",  t:"Bah, ça pourrait être nous dans une salle de réunion en train de brainstormer. Et on parlerait de [NOS PROJETS](#projets)."},
  {k:"act beat",  t:"De la pointe de l’index, CRÉATIF #2 caresse négligemment un Grand Prix Epica posé sur son bureau."},
  {k:"who",  t:"CRÉATIF #2"},
  {k:"say",  t:"Il faudrait aussi parler de [NOS AWARDS](#awards)."},
  {k:"who",  t:"CRÉATIF #1"},

  {k:"who",  t:"CRÉATIF #2"},
  {k:"say",  t:"Mais on signe comment ?"},
  {k:"who",  t:"CRÉATIF #1"},
  {k:"say",  t:"On va pas se prendre la tête, on piquera la signat’ d’une grande marque."},
  {k:"act beat",  t:"Les deux créatifs font silence comme s’ils entraient dans une profonde réflexion. L’image passe au flou. Packshot."},
  {k:"sig", t:"THINK DIFFERENT"}
];

const $ = s => document.querySelector(s);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const d = new Date();
const today = String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
document.querySelectorAll(".today").forEach(e => e.textContent = today);

/* ---------- construction ---------- */
const chars = [], cBlock = [];
function addChars(parent, text, bi){
  for (const ch of text){
    const s = document.createElement("span"); s.className = "c"; s.textContent = ch; parent.appendChild(s);
    chars.push(s); cBlock.push(bi);
  }
}
/* typo française + pas de mot orphelin : espace fine insécable avant ? ! ; :,
   « CRÉATIF #2 » jamais coupé, et les deux derniers mots de chaque paragraphe soudés */
function typo(t){
  t = t.replace(/ ([?!;:])/g, "\u202F$1").replace(/CRÉATIF #/g, "CRÉATIF\u00A0#");
  // jamais moins de trois mots sur la dernière ligne d'un paragraphe
  const w = t.split(" ");
  if (w.length > 4) return w.slice(0, -3).join(" ") + " " + w.slice(-3).join("\u00A0");
  const i = t.lastIndexOf(" ");
  return i > 0 ? t.slice(0, i) + "\u00A0" + t.slice(i + 1) : t;
}
SCRIPT.forEach(b => { if (!["ttl","sub","sig"].includes(b.k)) b.t = typo(b.t); });
const scriptEl = $("#script");
SCRIPT.forEach((b, bi) => {
  const p = document.createElement("p"); p.className = b.k; scriptEl.appendChild(p);
  const re = /\[([^\]]+)\]\(([^)]+)\)/g; let last = 0, m;
  while ((m = re.exec(b.t))){
    addChars(p, b.t.slice(last, m.index), bi);
    const a = document.createElement("a"); a.href = m[2]; p.appendChild(a); addChars(a, m[1], bi);
    last = m.index + m[0].length;
  }
  addChars(p, b.t.slice(last), bi);
});
const N = chars.length;
const PACK_AT = chars.findIndex((_, i) => SCRIPT[cBlock[i]].k === "sig");

/* ---------- règle pleine largeur, calée sur la zone de texte de la feuille ---------- */
const CM = 37.8, ruler = $("#ruler"), sheet = $("#sheet");
function buildRuler(){
  const r = sheet.getBoundingClientRect();
  const pad = parseFloat(getComputedStyle(sheet).paddingLeft);
  const zero = r.left + pad, end = r.right - pad;
  const rt = $("#rtext"); rt.style.left = zero + "px"; rt.style.width = (end - zero) + "px";
  ruler.style.setProperty("--zero", (zero % CM) + "px");
  $("#mk-first").style.left = zero + "px"; $("#mk-left").style.left = zero + "px"; $("#mk-right").style.left = end + "px";
  const nums = $("#nums"); nums.innerHTML = "";
  const W = ruler.clientWidth;
  for (let c = -Math.floor(zero / CM); zero + c*CM < W; c++){
    if (c === 0) continue;
    const s = document.createElement("span"); s.className = "num"; s.textContent = Math.abs(c);
    s.style.left = (zero + c*CM) + "px"; nums.appendChild(s);
  }
}

/* ---------- rendu ---------- */
const wrap = $("#wrap"), cur = $("#cur");
let n = 0, applied = 0, typing = false;
function apply(k){
  if (k > applied) for (let i=applied;i<k;i++) chars[i].classList.add("on");
  else for (let i=k;i<applied;i++) chars[i].classList.remove("on");
  applied = k;
}
function rel(el){ const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect(); return {x:r.left-w.left, y:r.top-w.top, r:r.right-w.left, h:r.height}; }
function caretAt(i){
  if (i <= 0) return rel(chars[0]);
  if (i < N && cBlock[i] !== cBlock[i-1]) return rel(chars[i]);
  const r = rel(chars[i-1]); return {x:r.r, y:r.y, h:r.h};
}
function render(){
  apply(n);
  const c = caretAt(n);
  cur.style.height = c.h + "px";
  cur.style.transform = `translate(${c.x}px,${c.y}px)`;
  cur.classList.toggle("blink", !typing);
}

/* ---------- frappe automatique ----------
   démarre seule et ne s'arrête jamais ;
   si on scrolle plus vite qu'elle, ce qui est déjà à l'écran s'écrit d'un coup */
const rnd = (a,b) => a + Math.random()*(b-a);
function delayAfter(i){
  const ch = chars[i].textContent;
  let t = rnd(7, 18);
  if (".!?".includes(ch)) t += 110;
  else if (",:;".includes(ch)) t += 50;
  if (i+1 < N && cBlock[i+1] !== cBlock[i]) t += SCRIPT[cBlock[i]].k === "who" ? 60 : 180;
  return t;
}
function step(){
  if (n >= N){ typing = false; render(); return; }
  typing = true; n++; render();
  setTimeout(step, delayAfter(n-1));
}
function catchUp(){
  if (n >= N || reduced) return;
  const limit = innerHeight - 140;
  if (chars[n].getBoundingClientRect().top > limit) return;
  let lo = n, hi = N-1;
  while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (chars[mid].getBoundingClientRect().top < limit) lo = mid; else hi = mid - 1; }
  if (lo + 1 - n > 40){ n = lo + 1; render(); }
}
addEventListener("scroll", catchUp, {passive:true});

document.querySelectorAll(".sheet a").forEach(a => a.addEventListener("click", e => {
  const el = document.querySelector(a.getAttribute("href"));
  if (el){ e.preventDefault(); el.scrollIntoView({behavior: reduced ? "auto" : "smooth"}); }
}));

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { buildRuler(); render(); }, 100); });

document.fonts.ready.then(() => {
  buildRuler();
  if (reduced){ n = N; render(); return; }
  render();
  setTimeout(step, 700);
});

  }
  function track(x, y){
    const last = trail[trail.length - 1];
    if (!last || Math.hypot(last.x - x, last.y - y) > 6) trail.push({x, y, t: performance.now()});
    if (!raf) raf = requestAnimationFrame(loop);
  }
  if (!reducedM){
    // pointermove + mousemove en secours, écoutés au niveau du document en phase de capture
    document.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.pointerType === "") track(e.clientX, e.clientY); }, {passive:true, capture:true});
    document.addEventListener("mousemove", e => track(e.clientX, e.clientY), {passive:true, capture:true});
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ cancelAnimationFrame(raf); raf = 0; draw(performance.now()); } });
  addEventListener("scroll", () => { if (!raf) draw(performance.now()); }, {passive:true});
  addEventListener("resize", size);
  img.decode().then(size, () => {});
  document.fonts.ready.then(() => draw(performance.now()));
  size();

  /* dev control, en bas à gauche */
  const pan = document.getElementById("devPan"), devBtn = document.getElementById("devBtn");
  const save = () => { try { localStorage.setItem("tf-home-dev", JSON.stringify(opt)); } catch(e){} };
  function sync(){
    pan.querySelectorAll(".seg[data-k]").forEach(sg => sg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", opt[sg.dataset.k] === b.dataset.v)));
    pan.querySelectorAll("[data-r]").forEach(r => { r.value = opt[r.dataset.r]; pan.querySelector(`[data-o="${r.dataset.r}"]`).textContent = opt[r.dataset.r]; });
  }
  devBtn.addEventListener("click", () => { pan.hidden = !pan.hidden; devBtn.setAttribute("aria-expanded", !pan.hidden); });
  pan.querySelectorAll(".seg[data-k]").forEach(sg => sg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; opt[sg.dataset.k] = b.dataset.v; save(); sync(); }));
  pan.querySelectorAll("[data-r]").forEach(r => r.addEventListener("input", () => { opt[r.dataset.r] = +r.value; save(); sync(); }));
  sync();
})();
})();

/* ---------- galerie projets ----------
   placeholders colorés ; le visuel passe d'ASCII à plein quand il approche du centre de l'écran,
   le nom de fichier se tape la première fois qu'il y arrive */
(() => {
  const P = [
    {fn:"BUILDING_TOMORROW.mp4", aw:["GRAND PRIX DU BRAND CONTENT_GOLD","THE DRUM AWARDS_WINNER X2"],                  href:"building-tomorrow",   c:"#FF5A36", l:8,  w:44, r:"4/5",  cap:"right-bottom", mt:0,  px:.05,  lm:0,  wm:86},
    {fn:"IMMUNITY_POTION_Actimel.mp4", page:"immunity-potion.html", aw:["EFFIE_SILVER"],            href:"immunity-potion",     c:"#FFD84D", l:48, w:44, r:"16/9", cap:"above-left",   mt:20, px:-.04, lm:12, wm:88},
    {fn:"NUK_SAFETY_SQUAD.mp4", aw:["EPICA_GOLD","CANNES LIONS_SHORTLIST"],                   href:"safety-squad",        c:"#9BE8FF", l:20, w:30, r:"4/5",  cap:"right-top",    mt:16, px:.07,  lm:4,  wm:74},
    {fn:"CUISINEL-LÀ_Cuisinella.mp4",             href:"cuisinella",          c:"#FF9ED8", l:3,  w:58, r:"16/9", cap:"below-right",  mt:18, px:-.03, lm:0,  wm:100},
    {fn:"THE_PARISIAN_RENDEZ-VOUS.mp4", aw:["CANNES LIONS_BRONZE","EPICA_GRAND PRIX"],           href:"parisian-rendez-vous",c:"#7CF29A", l:58, w:30, r:"3/4",  cap:"left-bottom",  mt:16, px:.06,  lm:26, wm:74},
    {fn:"EUPHYTOSE_ÉTUDIANTS.mp4",                href:"euphytose-etudiants", c:"#FFFFFF", l:28, w:42, r:"1/1",  cap:"above-right",  mt:22, px:-.05, lm:6,  wm:82},
    {fn:"EUPHYTOSE_STRESS.mp4",                   href:"euphytose-stress",    c:"#FFB000", l:6,  w:38, r:"4/5",  cap:"right-mid",    mt:16, px:.04,  lm:0,  wm:80},
    {fn:"SYNAESTHESIA_Moët&Chandon.mp4",          href:"synaesthesia",        c:"#C7B8FF", l:38, w:54, r:"16/9", cap:"below-left",   mt:20, px:-.04, lm:10, wm:90}
  ];
  const reducedM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const gal = document.getElementById("gal"), gnum = document.getElementById("gnum");
  const opts = {proj:"bleu", aw:"nuit"};
  // [fond, texte, accent]
  const BGS = {bleu:["#0000EE","#FFFFFF","#9DA8FF"], blanc:["#FFFFFF","#010824","#0000EE"], gris:["#ECEDF3","#010824","#0000EE"], nuit:["#010824","#FFFFFF","#3D3DFF"]};
  const SEC = {bg:"#0000EE", fg:"#FFFFFF"};
  opts.reveal = "ascii"; opts.name = "type";

  const hash = (i, j, s) => { let h = (i * 374761393 + j * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };

  const items = P.map((p, idx) => {
    const a = document.createElement("a");
    a.className = "proj";
    // pages projet refaites : lien interne ; les autres pointent encore vers l'ancien site
    if (p.page){ a.href = p.page; } else { a.href = "https://thomasetflorian.com/portfolios/" + p.href + "/"; a.target = "_blank"; a.rel = "noopener"; }
    a.setAttribute("aria-label", p.fn.replace(/\.mp4$/, "").replace(/_/g, " "));
    a.style.cssText = `--l:${p.l}%;--w:${p.w}%;--mt:${p.mt}vh;--ratio:${p.r};--ar:${p.r.split('/')[0]/p.r.split('/')[1]};--lm:${p.lm}%;--wm:${p.wm}%`;
    a.innerHTML = `<div class="frame"><canvas></canvas><span class="ph">Visuel ${p.r.replace("/",":")}</span></div><div class="cap ${p.cap}"><span class="fn"></span>${(p.aw||[]).length ? `<ul class="aw">${p.aw.map(t => `<li><span class="ast" aria-hidden="true">***</span> ${t} <span class="ast" aria-hidden="true">***</span></li>`).join("")}</ul>` : ""}<span class="go">Voir le projet →</span></div>`;
    gal.appendChild(a);
    const it = {p, idx, el:a, cv:a.querySelector("canvas"), ph:a.querySelector(".ph"), fn:a.querySelector(".fn"), rev:-1, typed:0, typing:false, named:false};
    it.ctx = it.cv.getContext("2d");
    return it;
  });

  function setup(it){
    const dpr = Math.min(2, devicePixelRatio || 1), w = it.cv.clientWidth, h = it.cv.clientHeight;
    if (!w || !h) return;
    it.w = w; it.h = h; it.cv.width = Math.round(w*dpr); it.cv.height = Math.round(h*dpr); it.ctx.setTransform(dpr,0,0,dpr,0,0);
    it.cw = w < 360 ? 7 : 9; it.ch = it.cw * 1.6;
    it.cols = Math.ceil(w / it.cw); it.rows = Math.ceil(h / it.ch);
    it.th = new Float32Array(it.cols * it.rows);
    for (let y=0; y<it.rows; y++) for (let x=0; x<it.cols; x++){
      const u = x / it.cols, v = y / it.rows;
      // ordre de révélation : du centre vers les bords, avec du grain
      const dc = Math.hypot(u - .5, v - .5) / .71;
      it.th[y*it.cols+x] = Math.min(.999, dc * .7 + hash(x, y, it.idx + 7) * .3);
    }
    it.rev = -1;
  }

  // l'ASCII ne copie pas le visuel : c'est un cache de caractères posé dessus, qui s'efface pour le révéler
  const GLYPHS = "/\\|_-+=*:.#";
  function paint(it, r){
    if (!it.th) return;
    const {ctx, w, h, cols, rows, cw, ch, p} = it;
    ctx.clearRect(0,0,w,h);
    // le visuel (placeholder coloré pour l'instant, image ou vidéo plus tard)
    ctx.fillStyle = p.c; ctx.fillRect(0,0,w,h);
    if (opts.reveal === "plain" || r >= .999) return;
    ctx.font = `500 ${(ch*.8).toFixed(1)}px "Martian Mono", ui-monospace, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let y=0; y<rows; y++) for (let x=0; x<cols; x++){
      const i = y*cols + x, t = it.th[i];
      if (r > t) continue;                       // case révélée : on voit le visuel
      ctx.fillStyle = SEC.bg; ctx.fillRect(x*cw, y*ch, cw + .6, ch + .6);
      const front = t - r < .06 && r > 0;          // bord de la révélation : caractères pleins
      const g = front ? "#" : GLYPHS[Math.floor(hash(x, y, it.idx + 3) * GLYPHS.length)];
      ctx.fillStyle = SEC.fg; ctx.globalAlpha = front ? 1 : .55;
      ctx.fillText(g, x*cw + cw/2, y*ch + ch/2 + .5);
      ctx.globalAlpha = 1;
    }
  }

  function typeName(it){
    if (it.typing || it.named) return;
    if (opts.name === "fixed" || reducedM){ it.fn.textContent = it.p.fn; it.named = true; it.el.classList.add("named"); return; }
    it.typing = true; let k = 0; const txt = [...it.p.fn];
    const caret = document.createElement("span"); caret.className = "k";
    const tick = () => {
      k++; it.fn.textContent = txt.slice(0, k).join(""); it.fn.appendChild(caret);
      if (k < txt.length) setTimeout(tick, 16 + Math.random()*22);
      else { it.typing = false; it.named = true; it.el.classList.add("named"); setTimeout(() => caret.remove(), 1600); }
    };
    tick();
  }

  // valeur de révélation selon la distance au centre de l'écran
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x*x*(3 - 2*x);
  let active = -1, running = false;
  function frame(){
    const vh = innerHeight, mid = vh / 2, narrow = innerWidth <= 760;
    let best = 1e9, bestD = 1e9, bi = 0;
    for (const it of items){
      const r = it.el.getBoundingClientRect();
      const c = r.top + r.height / 2, d = c - mid;
      // distance entre le visuel et la ligne médiane de l'écran (0 dès qu'il la touche)
      const gap = mid < r.top ? r.top - mid : mid > r.bottom ? mid - r.bottom : 0;
      if (gap < best || (gap === best && Math.abs(d) < Math.abs(bestD))){ best = gap; bestD = d; bi = it.idx; }
      if (r.bottom < -vh*.5 || r.top > vh*1.5) continue;
      // léger décalage de vitesse, pour casser l'alignement
      it.el.style.transform = reducedM || narrow ? "" : `translateY(${(-d * it.p.px).toFixed(1)}px)`;
      const near = gap / (vh * .5);
      const rv = reducedM ? 1 : smooth(1 - near / .7);
      if (Math.abs(rv - it.rev) > .004){ it.rev = rv; paint(it, rv); it.ph.style.opacity = rv > .98 ? 1 : 0; }
      if (near < .12) typeName(it);
    }
    if (bi !== active){ active = bi; gnum.textContent = String(bi + 1).padStart(2, "0") + " / " + String(items.length).padStart(2, "0"); }
    if (running) requestAnimationFrame(frame);
  }

  function resetNames(){
    items.forEach(it => { it.named = false; it.typing = false; it.fn.textContent = ""; it.el.classList.remove("named"); });
  }
  function apply(){
    const [pbg, pfg] = BGS[opts.proj] || BGS.bleu, [abg, afg, aac] = BGS[opts.aw] || BGS.nuit;
    SEC.bg = pbg; SEC.fg = pfg;
    const st = document.documentElement.style;
    st.setProperty("--proj-bg", pbg); st.setProperty("--proj-fg", pfg); st.setProperty("--aw-bg", abg); st.setProperty("--aw-fg", afg); st.setProperty("--aw-accent", aac);
    items.forEach(it => { it.rev = -1; });
  }
  new IntersectionObserver(es => es.forEach(e => {
    running = e.isIntersecting;
    if (running) requestAnimationFrame(frame);
  }), {threshold:0}).observe(document.getElementById("projets"));

  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { items.forEach(setup); frame(); }, 120); });
  document.fonts.ready.then(() => { items.forEach(setup); apply(); frame(); });
})();

/* ---------- awards : chaque ligne se tape quand elle arrive à l'écran, dans l'ordre ---------- */
(() => {
  const A = [
    ["2024 : EFFIE", "SILVER"],
    ["2023 : GRAND PRIX STRATÉGIES", "GOLD x 2"],
    ["2023 : THE DRUM AWARDS", "WINNER x 3"],
    ["2023 : ONE SHOW", "SHORTLIST x 9"],
    ["2022 : CANNES LIONS", "SHORTLIST"],
    ["2022 : EPICA", "GOLD"],
    ["2022 : CRESTA", "BRONZE x 4"],
    ["2022 : INNOVATION BY DESIGN", "FINALIST"],
    ["2020 : CLUB DES DA", "SILVER x 2"],
    ["2020 : CLUB DES DA", "BRONZE"],
    ["2020 : D&AD", "SHORTLIST x 2"],
    ["2019 : CANNES LIONS", "BRONZE"],
    ["2019 : EPICA", "GRAND PRIX"],
    ["2019 : EPICA", "GOLD x 2"],
    ["2015 : CRISTAL FESTIVAL", "SILVER"],
    ["2015 : CRISTAL FESTIVAL", "BRONZE"],
    ["1987 & 1989 : MEILLEURS CRÉATIFS SELON NOS MAMANS", "GRAND PRIX"]
  ];
  const reducedM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const list = document.getElementById("alist");
  const total = String(A.length).padStart(2, "0");
  const rows = A.map(([l, r, cls]) => {
    const li = document.createElement("li"); if (cls) li.className = cls;
    li.innerHTML = `<span class="l"></span><span class="lead" aria-hidden="true"></span><span class="r"></span>`;
    li.setAttribute("aria-label", `${l.replace(" : ", " ")} : ${r}`);
    list.appendChild(li);
    return {li, l, r, el:li.querySelector(".l"), er:li.querySelector(".r"), state:0};
  });
  let done = 0;
  const caret = document.createElement("span"); caret.className = "k";
  const sleep = ms => new Promise(res => setTimeout(res, ms));
  async function typeInto(el, txt, speed){
    const ch = [...txt];
    for (let i = 1; i <= ch.length; i++){ el.textContent = ch.slice(0, i).join(""); el.appendChild(caret); if (speed) await sleep(speed); }
  }
  // partie gauche : [année en bleu] [// en bleu] [nom du prix]
  const segsOf = l => { const [y, n] = l.split(" : "); return [["y", y], ["sep", " // "], ["", n]]; };
  async function typeSegs(el, segs, speed){
    el.textContent = "";
    for (const [cls, txt] of segs){
      const sp = document.createElement("span"); if (cls) sp.className = cls; el.appendChild(sp);
      for (const c of txt){ sp.textContent += c; el.appendChild(caret); if (speed) await sleep(speed); }
    }
  }
  function showNow(row){
    row.el.textContent = ""; segsOf(row.l).forEach(([cls, txt]) => { const sp = document.createElement("span"); if (cls) sp.className = cls; sp.textContent = txt; row.el.appendChild(sp); });
    row.er.textContent = row.r; row.li.classList.add("lead-on"); row.state = 2; fit(row);
  }
  // si le nom du prix passe sur plusieurs lignes, les pointillés repartent juste après le dernier mot
  function fit(row){
    const {li, el, er} = row, lead = li.querySelector(".lead");
    li.classList.remove("multi"); lead.style.width = ""; li.style.paddingRight = "";
    const lh = parseFloat(getComputedStyle(el).lineHeight) || 18;
    if (el.getBoundingClientRect().height < lh * 1.6) return;
    // on réserve la place du niveau à droite, le nom coule à gauche, les pointillés comblent la fin de sa dernière ligne
    const rw = er.getBoundingClientRect().width;
    li.classList.add("multi"); li.style.paddingRight = (rw + 10) + "px";
    lead.style.width = "0px";
    const range = document.createRange(); range.selectNodeContents(el);
    const rects = [...range.getClientRects()].filter(r => r.width > 0);
    const last = rects[rects.length - 1], lr = li.getBoundingClientRect();
    lead.style.width = Math.max(16, lr.right - rw - 10 - last.right - 8) + "px";
  }
  addEventListener("resize", () => rows.forEach(r => { if (r.state === 2) fit(r); }));
  const queue = []; let busy = false;
  async function pump(){
    if (busy) return; busy = true;
    while (queue.length){
      const row = queue.shift();
      // si on a pris du retard (scroll rapide), on accélère
      const fast = queue.length > 2, sp = fast ? 0 : 14;
      if (fast){ showNow(row); }
      else {
        await typeSegs(row.el, segsOf(row.l), sp);
        row.li.classList.add("lead-on"); await sleep(330);
        await typeInto(row.er, row.r, sp + 6);
        row.state = 2; fit(row);
      }
      await sleep(fast ? 0 : 90);
    }
    // le curseur reste à la fin de la dernière ligne tapée
    const last = rows.filter(r => r.state === 2).pop(); if (last) last.er.appendChild(caret);
    busy = false;
  }
  if (reducedM){ rows.forEach(showNow); return; }
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const i = rows.findIndex(r => r.li === e.target);
      // on met aussi en file les lignes au-dessus qui n'ont pas encore été tapées
      for (let k = 0; k <= i; k++) if (rows[k].state === 0){ rows[k].state = 1; queue.push(rows[k]); io.unobserve(rows[k].li); }
    });
    pump();
  }, {rootMargin:"0px 0px -18% 0px"});
  rows.forEach(r => io.observe(r.li));
})();

/* ---------- nous : frise verticale ---------- */
(() => {
  const today = (() => { const d = new Date(); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); })();
  const E = [
    {s:"R", y:"06/10/1987", t:"Naissance de CRÉATIF #2", p:"Sa psy lui a un jour fait remarquer que son « système cognitif fonctionne constamment à plein régime ». Ça explique peut-être son appétit pour l’écriture, des fanfictions Resident Evil de son enfance à ses conversations avec ChatGPT."},
    {s:"L", y:"24/09/1989", t:"Naissance de CRÉATIF #1", p:"Laissé trop jeune sans surveillance, il découvre les arts graphiques sur d’obscurs forums phpBB, en faisant des bannières pour les membres les plus en vue des clans Counter-Strike les moins en vue."},

    {s:"L", y:"2026", t:"Comment voir dans le noir", p:"CRÉATIF #2 publie son livre aux éditions des Corps Conducteurs. <a href=\"https://www.lescorpsconducteurs.fr/nos-livres\" target=\"_blank\" rel=\"noopener\">Lire →</a>"},
    {s:"R", y:today, t:"VML Paris", p:"Ils travaillent en agence et continuent leurs projets, en solo comme à deux, toujours à l’affût d’une nouvelle opportunité créative. <a href=\"mailto:florian.amoneau@gmail.com\">Contacter →</a>", now:true}
  ];
  const reducedM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tl = document.getElementById("tl"), ol = document.getElementById("ents"), photo = document.getElementById("photo");
  const svg = document.getElementById("svgtl"), path = document.getElementById("tlpath"), rect = document.getElementById("tlrect");
  const items = E.map(e => {
    const li = document.createElement("li");
    li.className = "ent " + e.s + (e.now ? " now" : "");
    const tail3 = str => { const m = str.match(/^(.*?)((?:\S+ ){2}\S+)(\s*(?:<a .*)?)$/s); return m && m[1].trim().split(" ").length > 1 ? m[1] + m[2].replace(/ /g, "\u00A0") + m[3] : str; };
    const p = tail3(e.p).replace(/(\d) (\d{3})/g, "$1\u00A0$2").replace(/ %/g, "\u00A0%").replace(/ ([:;?!»])/g, "\u202F$1").replace(/« /g, "«\u202F");
    li.innerHTML = `<span class="nd" aria-hidden="true">*</span><div class="tx"><span class="yr"></span>${p ? `<p>${p}</p>` : ""}</div>`;
    ol.appendChild(li);
    return {e, li, nd: li.querySelector(".nd"), yr: li.querySelector(".yr"), state: 0};
  });

  // une seule ligne, qui part du bas de la photo
  function layout(){
    const narrow = innerWidth <= 760, x = narrow ? 12 : tl.clientWidth / 2;
    items.forEach(it => it.li.style.setProperty("--x", x + "px"));
    const tr = tl.getBoundingClientRect(), pr = photo.getBoundingClientRect();
    const y0 = pr.bottom - tr.top;
    const last = items[items.length - 1].nd.getBoundingClientRect();
    path.setAttribute("d", `M ${x} ${y0} L ${x} ${last.top + last.height / 2 - tr.top}`);
    svg.setAttribute("height", tl.scrollHeight);
    tick();
  }

  // la ligne se déroule avec le scroll ; chaque étape s'écrit quand la ligne l'atteint
  const caret = document.createElement("span"); caret.className = "k";
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function typeYear(it){
    it.state = 1;
    const segs = [["y", it.e.y], ["sep", " // "], ["", it.e.t]];
    it.yr.textContent = "";
    for (const [cls, txt] of segs){
      const sp = document.createElement("span"); if (cls) sp.className = cls; it.yr.appendChild(sp);
      for (const c of txt){ sp.textContent += c; it.yr.appendChild(caret); if (!reducedM) await sleep(18); }
    }
    it.li.classList.add("on"); it.state = 2;
    if (!it.e.now) setTimeout(() => { if (caret.parentNode === it.yr) caret.remove(); }, 900);
  }
  function tick(){
    const tr = tl.getBoundingClientRect();
    const reach = reducedM ? 1e6 : innerHeight * .8 - tr.top;
    rect.setAttribute("height", Math.max(0, reach));
    items.forEach(it => {
      if (it.state) return;
      const r = it.nd.getBoundingClientRect();
      if (r.top - tr.top < reach) typeYear(it);
    });
  }
  addEventListener("scroll", tick, {passive:true});
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 100); });
  const img = photo.querySelector("img");
  (img.complete ? Promise.resolve() : new Promise(r => img.onload = r)).then(() => document.fonts.ready).then(layout);
})();
